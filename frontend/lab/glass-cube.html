<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#070a0e;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.setPixelRatio(2);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#070a0e');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); camera.position.set(0, 0, 7.2);

// Backdrop: cyan dot-matrix with a soft light band — glass needs something behind it to bend.
const c = document.createElement('canvas'); c.width = 1600; c.height = 1000; const g = c.getContext('2d');
g.fillStyle = '#070a0e'; g.fillRect(0, 0, c.width, c.height);
const band = g.createLinearGradient(0, 300, 1600, 700);
band.addColorStop(0, 'rgba(111,231,240,0)'); band.addColorStop(.45, 'rgba(111,231,240,.9)'); band.addColorStop(.55, 'rgba(160,140,255,.8)'); band.addColorStop(1, 'rgba(111,231,240,0)');
for (let y = 6; y < c.height; y += 14) for (let x = 6; x < c.width; x += 14) {
  const dy = (y - (300 + x * 0.25)) / 140; const a = Math.exp(-dy * dy * 1.6) * 0.7 + 0.04;
  g.fillStyle = `rgba(${dy > 0 ? 150 : 111},${dy > 0 ? 160 : 231},${dy > 0 ? 255 : 240},${a})`;
  g.beginPath(); g.arc(x, y, 2.1, 0, 7); g.fill();
}
const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
const back = new THREE.Mesh(new THREE.PlaneGeometry(16, 10), new THREE.MeshBasicMaterial({ map: tex }));
back.position.z = -4; scene.add(back);

// The glass cube: physically-based transmission (light passes through and bends), thin-film iridescence.
const glass = new THREE.MeshPhysicalMaterial({
  color: '#ffffff', metalness: 0, roughness: 0.04, transmission: 1, thickness: 1.4, ior: 1.5,
  iridescence: 1, iridescenceIOR: 1.3, iridescenceThicknessRange: [200, 600],
  clearcoat: 0.7, clearcoatRoughness: 0.08, envMapIntensity: 0.6, specularIntensity: 0.8,
});
const cube = new THREE.Mesh(new RoundedBoxGeometry(2, 2, 2, 8, 0.18), glass);
cube.rotation.set(THREE.MathUtils.degToRad(24), THREE.MathUtils.degToRad(+(new URLSearchParams(location.search).get('y') || 35)), 0);
scene.add(cube);
// Bright edge highlights
const key = new THREE.DirectionalLight('#ffffff', 1.3); key.position.set(-3, 4, 5); scene.add(key);
// Coloured rim lights: they paint the edges cyan and violet as the cube turns.
const rimA = new THREE.PointLight('#6fe7f0', 22, 12); rimA.position.set(3.5, 1.5, 2); scene.add(rimA);
const rimB = new THREE.PointLight('#9a7bff', 18, 12); rimB.position.set(-3.5, -1.5, 2); scene.add(rimB);
// A thin bright bar behind the cube: its bent image inside the glass is what sells 'glass'.
const bar = new THREE.Mesh(new THREE.PlaneGeometry(16, 0.06), new THREE.MeshBasicMaterial({ color: '#e9f9ff' }));
bar.position.set(0, -0.2, -3.9); bar.rotation.z = -0.25; scene.add(bar);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W * 2, H * 2, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.22, 0.4, 0.7));
composer.addPass(new OutputPass());
composer.render(); composer.render();
document.title = 'ready';
</script></body></html>
