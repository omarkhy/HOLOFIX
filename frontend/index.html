<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOLOFIX</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Import map: lets viewer.js write `import ... from 'three'` with no bundler.
       Version is pinned so the page never changes under us. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Opening scene (boot.js + brand.js) is DISABLED for now. To re-enable: restore the #boot
       cover, body class "booting", and the two <script> tags (see git history, commit "neon power-down"). -->

  <!-- Dot field in the top-left corner, drawn by nav.js; fades into the dark. -->
  <canvas class="corner-dots" id="corner-dots" aria-hidden="true"></canvas>

  <header class="top">
    <div class="brand">
      <button class="menu-btn" id="menu-btn" aria-label="Show menu" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <img class="brand-mark" src="favicon.svg" alt="" width="26" height="26">
      <span class="brand-name">HOLOFIX</span>
    </div>

    <!-- Systems rail: like the museum timeline. Click a system to isolate its parts. -->
    <nav class="rail" id="rail" aria-label="Systems"></nav>

    <div class="device-meta" id="device-meta"></div>
  </header>

  <main class="hall">
    <!-- Side menu (YouTube-style): icons only when collapsed, labels when open.
         Items marked "soon" become links as each feature is built. -->
    <nav class="drawer" id="drawer" aria-label="Main">
      <a class="nav-item" href="#explore" aria-current="page" title="Explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
        <span class="label">Explore</span>
      </a>
      <button class="nav-item" disabled title="Diagnose (soon)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
        <span class="label">Diagnose</span><em>soon</em>
      </button>
      <button class="nav-item" disabled title="New device (soon)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></svg>
        <span class="label">New device</span><em>soon</em>
      </button>
      <button class="nav-item" disabled title="Library (soon)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="11" width="16" height="9" rx="1"/></svg>
        <span class="label">Library</span><em>soon</em>
      </button>
      <div class="divider" role="separator"></div>
      <button class="nav-item" disabled title="Method &amp; accuracy (soon)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 20V12M11 20V5M17 20v-9M3 20h18"/></svg>
        <span class="label">Method &amp; accuracy</span><em>soon</em>
      </button>
    </nav>

    <section class="stage" id="stage" aria-label="3D exploded view">
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="stage-status" id="stage-status">Loading model…</div>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="bottom">
    <label class="explode">
      <span>Explode</span>
      <input type="range" id="explode" min="0" max="100" step="0.1" value="0">
    </label>

    <ul class="legend" aria-label="Connection types">
      <li><i class="swatch data"></i>Data</li>
      <li><i class="swatch power"></i>Power</li>
      <li><i class="swatch thermal"></i>Heat</li>
      <li><i class="swatch mechanical"></i>Mounted to</li>
    </ul>

    <ul class="hints">
      <li><kbd>Drag</kbd>Rotate</li>
      <li><kbd>Scroll</kbd>Zoom</li>
      <li><kbd>Click</kbd>Part details</li>
      <li><kbd>Esc</kbd>Clear</li>
    </ul>
  </footer>

  <script type="module" src="nav.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
